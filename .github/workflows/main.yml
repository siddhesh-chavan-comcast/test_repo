name:  Tests

on:
  workflow_dispatch: # allow manual trigger for testing
    inputs:
        time_window_minutes:
            description: 'Time window in minutes to check for updated PRs'
            required: false
            default: '5'
            type: string

jobs:
  check-player_interface-prs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      LATEST_PR: 0
      PLAYER_INTERFACE_REPO: ${{ github.workspace }}/../middleware-player-interface/
      PLAYER_INTERFACE_GIT: "https://github.com/rdkcentral/middleware-player-interface.git"
      MTF_REPO: ${{ github.workspace }}/
      TEST_STREAMS: ${{ github.workspace }}/../test_streams
      WORKING_ROOT: ${{ github.workspace }}/../


    steps:
    - name: Checkout repository
      uses: actions/checkout@v4


    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y tree 
        # gstreamer1.0-libav gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly


    - name: Get previous latest PR number from repository variable
      run: |
        previous_pr=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${{ github.repository }}/actions/variables/LATEST_PR_NUMBER" \
          | jq -r '.value' 2>/dev/null || echo "0")
        echo "Previous latest PR number: $previous_pr"
        echo "PREVIOUS_LATEST_PR=$previous_pr" >> $GITHUB_ENV

    - name: Print cached PR number before clone
      run: |
        echo "Cached PR number before clone: ${{ env.PREVIOUS_LATEST_PR }}"

    - name: Clone Player Interface repo
      working-directory: ${{ env.WORKING_ROOT }}
      env:
        TIME_WINDOW: ${{ github.event.inputs.time_window_minutes || '5' }}
      run: |
        git clone https://github.com/rdkcentral/middleware-player-interface.git
        prs=$(curl -s "https://api.github.com/repos/rdkcentral/middleware-player-interface/pulls?state=open&per_page=100")
        latest_pr=$(echo "$prs" | jq 'sort_by(.updated_at) | reverse | .[0]')
        latest_pr_number=$(echo "$latest_pr" | jq -r '.number')
        echo "Latest PR number: $latest_pr_number"
        echo "NEW_LATEST_PR=$latest_pr_number" >> $GITHUB_ENV

    - name: Update repository variable with latest PR number
      run: |
        # Check if variable exists
        response=$(curl -s -o /dev/null -w "%{http_code}" \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${{ github.repository }}/actions/variables/LATEST_PR_NUMBER")
        
        if [ "$response" = "200" ]; then
          # Update existing variable
          curl -X PATCH \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/variables/LATEST_PR_NUMBER" \
            -d "{\"name\":\"LATEST_PR_NUMBER\",\"value\":\"${{ env.NEW_LATEST_PR }}\"}"
        else
          # Create new variable
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/variables" \
            -d "{\"name\":\"LATEST_PR_NUMBER\",\"value\":\"${{ env.NEW_LATEST_PR }}\"}"
        fi
        echo "Updated LATEST_PR_NUMBER to ${{ env.NEW_LATEST_PR }}"


